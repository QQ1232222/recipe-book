<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>味噌湯｜私房食譜</title>
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body>
  <main class="recipe">
    <a class="back" href="../index.html">← 回首頁</a>

    <header class="hero">
      <h1>味噌湯</h1>
      <p class="subtitle">份數：待補<span class="tag tag-soup">湯品</span></p>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <div class="times">
          <section id="prep-time">
            <h2>準備時間</h2>
            <p>待補</p>
          </section>
          <section id="cook-time">
            <h2>烹飪時間</h2>
            <p>待補</p>
          </section>
        </div>

        <section id="ingredients" class="ingredients">
          <h2>食材清單</h2>
          <ul>
            <li><span>豆腐</span><span class="qty">半盒</span></li>
            <li><span>海帶芽</span><span class="qty">一小把</span></li>
            <li><span>味噌</span><span class="qty">2 大匙</span></li>
            <li><span>蔥</span><span class="qty">1 根</span></li>
            <li><span>水</span><span class="qty">600ml</span></li>
          </ul>
        </section>
      </aside>

      <div class="main">
        <section id="steps" class="steps">
          <h2>步驟</h2>
          <ol>
            <li>豆腐切小塊，蔥切蔥花。</li>
            <li>水煮滾，放豆腐跟海帶芽。</li>
            <li>轉小火，味噌用湯勺裝一點湯先調開，再倒回鍋裡。</li>
            <li>最後撒蔥花，關火。</li>
          </ol>
        </section>

        <section id="tips" class="tips">
          <h2>小秘訣</h2>
          <ul>
            <li>味噌放進去之後不要再煮滾，香味會跑掉。</li>
          </ul>
        </section>
      </div>
    </div>

    <p class="source">來源：味增湯.txt｜最後更新：2026-11-16</p>
  </main>
</body>
</html>
