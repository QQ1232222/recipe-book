<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>鮮奶酪｜私房食譜</title>
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body>
  <main class="recipe">
    <a class="back" href="../index.html">← 回首頁</a>

    <header class="hero">
      <h1>鮮奶酪</h1>
      <p class="subtitle">份數：待補<span class="tag tag-dessert">甜點</span></p>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <div class="times">
          <section id="prep-time">
            <h2>準備時間</h2>
            <p>待補</p>
          </section>
          <section id="cook-time">
            <h2>烹飪時間</h2>
            <p>待補</p>
          </section>
        </div>

        <section id="ingredients" class="ingredients">
          <h2>食材清單</h2>
          <ul>
            <li><span>鮮奶</span><span class="qty">500ml</span></li>
            <li><span>糖</span><span class="qty">份量待補</span></li>
            <li><span>吉利丁片</span><span class="qty">4 片</span></li>
            <li><span>冰水（泡吉利丁用）</span><span class="qty">份量待補</span></li>
          </ul>
        </section>
      </aside>

      <div class="main">
        <section id="steps" class="steps">
          <h2>步驟</h2>
          <ol>
            <li>吉利丁片泡冰水，泡軟。</li>
            <li>鮮奶和糖用小火加熱，糖融化就好，不要煮滾。</li>
            <li>關火，吉利丁擠乾水後放進去，攪到融化。</li>
            <li>過篩，倒進杯子。</li>
            <li>放涼後放進冰箱，冰到凝固。</li>
          </ol>
        </section>

        <section id="tips" class="tips">
          <h2>小秘訣</h2>
          <ul>
            <li>上面可以淋蜂蜜或放水果。</li>
            <li>過篩比較滑，沒有氣泡。</li>
          </ul>
        </section>
      </div>
    </div>

    <p class="source">來源：鮮奶酪.txt｜最後更新：2026-11-15</p>
  </main>
</body>
</html>
