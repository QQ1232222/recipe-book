<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>私房食譜</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <main class="container">
    <header class="hero">
      <h1>私房食譜</h1>
      <p class="subtitle">Recipe Book</p>
    </header>

    <nav class="filters" aria-label="分類篩選">
      <button type="button" data-filter="all" class="active">全部</button>
      <button type="button" data-filter="appetizer">前菜</button>
      <button type="button" data-filter="soup">湯品</button>
      <button type="button" data-filter="salad">沙拉</button>
      <button type="button" data-filter="main">主餐</button>
      <button type="button" data-filter="dessert">甜點</button>
      <button type="button" data-filter="drink">飲品</button>
    </nav>

    <section id="recipe-list" class="card-grid">
      <!-- 食譜卡片放這裡，格式見 AGENTS.md 3.1；依上菜順序：前菜→湯品→沙拉→主餐→甜點→飲品 -->
      <a class="card" data-category="soup" href="recipes/corn-soup.html">
        <h2>玉米濃湯</h2>
        <p class="meta"><span class="tag tag-soup">湯品</span> 準備 10 分鐘・烹飪 20 分鐘</p>
      </a>
      <a class="card" data-category="soup" href="recipes/miso-soup.html">
        <h2>味噌湯</h2>
        <p class="meta"><span class="tag tag-soup">湯品</span> 準備 待補・烹飪 待補</p>
      </a>
      <a class="card" data-category="main" href="recipes/egg-fried-rice.html">
        <h2>蛋炒飯</h2>
        <p class="meta"><span class="tag tag-main">主餐</span> 準備 待補・烹飪 待補</p>
      </a>
      <a class="card" data-category="dessert" href="recipes/milk-pudding.html">
        <h2>鮮奶酪</h2>
        <p class="meta"><span class="tag tag-dessert">甜點</span> 準備 待補・烹飪 待補</p>
      </a>
    </section>

    <p id="empty-state" class="empty" hidden>尚未收錄食譜</p>
  </main>

  <footer class="site-footer">
    <p>私房食譜 Recipe Book</p>
  </footer>

  <script src="assets/script.js"></script>
</body>
</html>
